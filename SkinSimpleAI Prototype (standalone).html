  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

serif; font-weight: 700; font-size: 14.5px; color: #3A322E;\">Is my data kept private?<\u002Fdiv>\n                      <div style=\"font-size: 13px; color: #9C8F87; margin-top: 4px; line-height: 1.4;\">Yes — see our Privacy settings for details.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ a.confirmLogout }}\">\n              <div style=\"position: absolute; inset: 0; background: rgba(58,50,46,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 32px;\">\n                <div style=\"background: #FFFFFF; border-radius: 22px; padding: 26px 22px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.25);\">\n                  <div style=\"font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 18px; color: #3A322E; text-align: center;\">Log out?<\u002Fdiv>\n                  <div style=\"font-size: 14px; color: #9C8F87; text-align: center; line-height: 1.4;\">You'll need to log back in to see your skin profile and scan history.<\u002Fdiv>\n                  <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 4px;\">\n                    <div onclick=\"{{ a.logOut }}\" style=\"padding: 14px; border-radius: 14px; background: #DD8FA6; color: #FFFFFF; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; text-align: center; cursor: pointer;\">Log Out<\u002Fdiv>\n                    <div onclick=\"{{ a.cancelLogout }}\" style=\"padding: 14px; border-radius: 14px; background: #F6F1EC; color: #3A322E; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px; text-align: center; cursor: pointer;\">Cancel<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ a.showTabBar }}\">\n              <div style=\"display: flex; padding: 10px 12px 26px; border-top: 1px solid #F0E4E2; background: #FFFFFF;\">\n                <sc-for list=\"{{ a.tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div onclick=\"{{ t.onClick }}\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer;\">\n                    <sc-if value=\"{{ t.isHome }}\">\n                      <div style=\"width: 20px; height: 20px; border-radius: 6px; background: {{ t.color }};\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ t.isScan }}\">\n                      <div style=\"width: 20px; height: 20px; border-radius: 50%; border: 3px solid {{ t.color }}; box-sizing: border-box;\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ t.isProfile }}\">\n                      <div style=\"width: 20px; height: 20px; border-radius: 50%; background: {{ t.color }};\"><\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"font-size: 11px; font-weight: 600; color: {{ t.color }};\">{{ t.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n\n        <\u002Fx-import>\n      <\u002Fdiv>\n\n\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nconst SKIN_TYPES = ['Dry', 'Normal', 'Combination', 'Oily'];\nconst CONCERNS = ['Acne & breakouts', 'Blackheads', 'Dark spots', 'Redness', 'Dryness', 'Oiliness', 'Dullness', 'Enlarged pores', 'Fine lines', 'Uneven texture'];\nconst BUDGETS = ['Under $15', '$15–30', '$30–50', '$50+', \"I'm open to anything\"];\n\nfunction resolveImg(path, id) {\n  if (typeof window !== 'undefined' && window.__resources && window.__resources[id]) return window.__resources[id];\n  return path;\n}\n\nconst PALETTES = {\n  a: { deep: '#DD8FA6', white: '#FFFFFF', textDark: '#3A322E', border: '#F0E4E2' },\n  b: { deep: '#7A5FB0', white: '#FFFFFF', textDark: '#2E2A38', border: '#E3D9F0' },\n};\n\nconst SCREEN_GROUPS = {\n  home: 'home',\n  scan: 'scan', result: 'scan', alternatives: 'scan',\n  profile: 'profile', privacy: 'profile', help: 'profile',\n};\n\nclass Component extends DCLogic {\n  state = {\n    a: { screen: 'welcome', onboarded: false, returnTo: 'home', skinType: null, sensitive: null, concerns: [], otherSelected: false, otherConcern: '', budget: null, notificationsOn: true, confirmLogout: false, signupName: '', signupEmail: '', signupPassword: '', loginEmail: '', loginPassword: '', saveHistoryOn: true, personalizedOn: true, scanHistory: [{ id: 'seed1', name: 'Hydra Glow Moisturizer', brand: 'DewyLab', swatchImg: resolveImg('images/cucumber.jpg', 'cucumberSwatch'), match: 'good' }] },\n    b: { screen: 'welcome', onboarded: false, returnTo: 'home', skinType: null, sensitive: null, concerns: [], otherSelected: false, otherConcern: '', budget: null, notificationsOn: true, confirmLogout: false, signupName: '', signupEmail: '', signupPassword: '', loginEmail: '', loginPassword: '', saveHistoryOn: true, personalizedOn: true, scanHistory: [{ id: 'seed1', name: 'Hydra Glow Moisturizer', brand: 'DewyLab', swatchImg: resolveImg('images/cucumber.jpg', 'cucumberSwatch'), match: 'good' }] },\n  };\n\n  setScreen(letter, screen) {\n    this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], screen } }));\n  }\n\n  buildVariant(letter) {\n    const st = this.state[letter];\n    const pal = PALETTES[letter];\n    const go = (screen) => () => this.setState(prev => ({\n      ...prev,\n      [letter]: { ...prev[letter], screen, onboarded: prev[letter].onboarded || screen === 'home' },\n    }));\n    const goQuizBudgetContinue = st.onboarded ? go(st.returnTo) : go('signup');\n    const goQuizTypeBack = st.onboarded ? go(st.returnTo) : go('welcome');\n    const goExit = go(st.returnTo);\n\n    const noop = () => {};\n    const emailRe = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n    const signupValid = emailRe.test(st.signupEmail) && st.signupPassword.length >= 6;\n    const hasAccount = !!(st.signupEmail && st.signupPassword);\n    const accountMatch = hasAccount && st.loginEmail === st.signupEmail && st.loginPassword === st.signupPassword;\n    const loginFormatValid = emailRe.test(st.loginEmail) && st.loginPassword.length >= 6;\n    const loginValid = loginFormatValid && accountMatch;\n    const createAccount = signupValid ? go('home') : noop;\n    const doLogin = loginValid ? go('home') : noop;\n\n    const typeValid = !!st.skinType && st.sensitive !== null;\n    const concernsValid = st.concerns.length > 0 || (st.otherSelected && st.otherConcern.trim().length > 0);\n    const budgetValid = !!st.budget;\n    const continueFromType = typeValid ? go('quiz-concerns') : noop;\n    const continueFromConcerns = concernsValid ? go('quiz-budget') : noop;\n    const continueFromBudget = budgetValid ? goQuizBudgetContinue : noop;\n    const goToEdit = (screen, ret) => () => this.setState(prev => ({\n      ...prev,\n      [letter]: { ...prev[letter], screen, returnTo: ret },\n    }));\n\n    const skinTypes = SKIN_TYPES.map(label => {\n      const selected = st.skinType === label;\n      return {\n        key: label, label, selected,\n        bg: selected ? pal.deep : pal.white,\n        color: selected ? '#FFFFFF' : pal.textDark,\n        border: selected ? pal.deep : pal.border,\n        onClick: () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], skinType: label } })),\n      };\n    });\n\n    const sensitiveOptions = [true, false].map(val => {\n      const selected = st.sensitive === val;\n      return {\n        key: val ? 'yes' : 'no', label: val ? 'Yes' : 'No', selected,\n        bg: selected ? pal.deep : pal.white,\n        color: selected ? '#FFFFFF' : pal.textDark,\n        border: selected ? pal.deep : pal.border,\n        onClick: () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], sensitive: val } })),\n      };\n    });\n\n    const concernOptions = CONCERNS.map(label => {\n      const selected = st.concerns.includes(label);\n      return {\n        key: label, label, selected,\n        bg: selected ? pal.deep : pal.white,\n        color: selected ? '#FFFFFF' : pal.textDark,\n        border: selected ? pal.deep : pal.border,\n        onClick: () => this.setState(prev => {\n          const cur = prev[letter].concerns;\n          const next = cur.includes(label) ? cur.filter(c => c !== label) : [...cur, label];\n          return { ...prev, [letter]: { ...prev[letter], concerns: next } };\n        }),\n      };\n    });\n\n    const budgetOptions = BUDGETS.map(label => {\n      const selected = st.budget === label;\n      return {\n        key: label, label, selected,\n        bg: selected ? pal.deep : pal.white,\n        color: selected ? '#FFFFFF' : pal.textDark,\n        border: selected ? pal.deep : pal.border,\n        onClick: () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], budget: label } })),\n      };\n    });\n\n    const otherChip = {\n      key: 'other', label: 'Other', selected: st.otherSelected,\n      bg: st.otherSelected ? pal.deep : pal.white,\n      color: st.otherSelected ? '#FFFFFF' : pal.textDark,\n      border: st.otherSelected ? pal.deep : pal.border,\n      onClick: () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], otherSelected: !prev[letter].otherSelected } })),\n    };\n\n    const setOtherConcern = (e) => {\n      const val = e.target.value;\n      this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], otherConcern: val } }));\n    };\n\n    const setField = (field) => (e) => {\n      const val = e.target.value;\n      this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], [field]: val } }));\n    };\n\n    const captureScan = () => this.setState(prev => {\n      const cur = prev[letter];\n      let history = cur.scanHistory;\n      if (cur.saveHistoryOn) {\n        const entry = { id: 'scan-' + Date.now(), name: 'GlowMax Vitamin C Serum', brand: 'Brightening Co.', swatchImg: resolveImg('images/flower.jpg', 'flowerSwatch'), match: 'bad' };\n        history = [entry, ...history.filter(h => h.name !== entry.name)].slice(0, 5);\n      }\n      return { ...prev, [letter]: { ...cur, screen: 'result', scanHistory: history } };\n    });\n\n    const badgeGood = letter === 'a' ? { bg: '#E1EFE7', color: '#4A7C60' } : { bg: '#E6F1E1', color: '#4A7C57' };\n    const badgeBad = letter === 'a' ? { bg: '#FBE3DA', color: '#C06A45' } : { bg: '#FBE7DE', color: '#B36A4C' };\n\n    const recentScans = st.scanHistory.map(h => ({\n      key: h.id, name: h.name, brand: h.brand, swatchImg: h.swatchImg,\n      badgeText: h.match === 'good' ? 'Good' : '42%',\n      badgeBg: h.match === 'good' ? badgeGood.bg : badgeBad.bg,\n      badgeColor: h.match === 'good' ? badgeGood.color : badgeBad.color,\n      onClick: h.match === 'good' ? (() => {}) : go('result'),\n    }));\n    const hasScanHistory = recentScans.length > 0;\n\n    const reasons = [\n      { key: 'r1', icon: '✕', iconBg: '#D98B6B', text: 'Contains fragrance — may irritate sensitive skin' },\n      { key: 'r2', icon: '✕', iconBg: '#D98B6B', text: 'High Vitamin C strength — can be too much for beginners' },\n      { key: 'r3', icon: '✓', iconBg: '#7FAE93', text: 'Lightweight, non-comedogenic base' },\n    ];\n\n    const altProducts = [\n      { key: 'p1', name: 'Pure Radiance Vitamin C 10%', brand: 'CalmSkin', price: '$24', match: '91%', note: 'Fragrance-free · Gentle 10% Vitamin C' },\n      { key: 'p2', name: 'Sensitive Bright Serum', brand: 'DewyLab', price: '$19', match: '88%', note: 'No fragrance · Soothing aloe base' },\n      { key: 'p3', name: 'Daily Glow Drops', brand: 'MinimalSkin', price: '$16', match: '85%', note: 'Fragrance-free · Beginner-friendly strength' },\n    ];\n\n    const profileRows = [\n      { key: 'p', label: 'Privacy', onClick: go('privacy') },\n      { key: 'h', label: 'Help & Support', onClick: go('help') },\n    ];\n\n    const toggleNotifications = () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], notificationsOn: !prev[letter].notificationsOn } }));\n    const toggleSaveHistory = () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], saveHistoryOn: !prev[letter].saveHistoryOn } }));\n    const togglePersonalized = () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], personalizedOn: !prev[letter].personalizedOn } }));\n\n    const openLogoutConfirm = () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], confirmLogout: true } }));\n    const cancelLogout = () => this.setState(prev => ({ ...prev, [letter]: { ...prev[letter], confirmLogout: false } }));\n    const logOut = () => this.setState(prev => ({\n      ...prev,\n      [letter]: {\n        screen: 'welcome', onboarded: false, returnTo: 'home',\n        skinType: null, sensitive: null,\n        concerns: [], otherSelected: false, otherConcern: '',\n        budget: null, notificationsOn: prev[letter].notificationsOn, confirmLogout: false,\n        saveHistoryOn: prev[letter].saveHistoryOn, personalizedOn: prev[letter].personalizedOn,\n        signupName: prev[letter].signupName, signupEmail: prev[letter].signupEmail, signupPassword: prev[letter].signupPassword,\n        loginEmail: '', loginPassword: '',\n        scanHistory: [{ id: 'seed1', name: 'Hydra Glow Moisturizer', brand: 'DewyLab', swatchImg: resolveImg('images/cucumber.jpg', 'cucumberSwatch'), match: 'good' }],\n      },\n    }));\n\n    const group = SCREEN_GROUPS[st.screen];\n    const showTabBar = !!group;\n    const tabColorActive = pal.deep;\n    const tabColorInactive = letter === 'a' ? '#C9BAB4' : '#B7A9C8';\n    const tabs = [\n      { key: 'home', label: 'Home', isHome: true, isScan: false, isProfile: false, color: group === 'home' ? tabColorActive : tabColorInactive, onClick: go('home') },\n      { key: 'scan', label: 'Scan', isHome: false, isScan: true, isProfile: false, color: group === 'scan' ? tabColorActive : tabColorInactive, onClick: go('scan') },\n      { key: 'profile', label: 'Profile', isHome: false, isScan: false, isProfile: true, color: group === 'profile' ? tabColorActive : tabColorInactive, onClick: go('profile') },\n    ];\n\n    return {\n      isWelcome: st.screen === 'welcome',\n      isQuizType: st.screen === 'quiz-type',\n      isQuizConcerns: st.screen === 'quiz-concerns',\n      isQuizBudget: st.screen === 'quiz-budget',\n      isSignup: st.screen === 'signup',\n      isLogin: st.screen === 'login',\n      isPrivacy: st.screen === 'privacy',\n      isHelp: st.screen === 'help',\n      isHome: st.screen === 'home',\n      isScan: st.screen === 'scan',\n      isResult: st.screen === 'result',\n      isAlternatives: st.screen === 'alternatives',\n      isProfile: st.screen === 'profile',\n      showTabBar,\n      goWelcome: go('welcome'), goLogin: go('login'), goQuizType: go('quiz-type'), goQuizConcerns: go('quiz-concerns'),\n      goQuizBudget: go('quiz-budget'), goSignup: go('signup'), goHome: go('home'), goQuizBudgetContinue,\n      goEditTypeFromHome: goToEdit('quiz-type', 'home'),\n      goEditTypeFromProfile: goToEdit('quiz-type', 'profile'),\n      goEditConcernsFromProfile: goToEdit('quiz-concerns', 'profile'),\n      goEditBudgetFromProfile: goToEdit('quiz-budget', 'profile'),\n      goQuizTypeBack, goExit, showExit: st.onboarded,\n      typeValid, concernsValid, budgetValid,\n      continueFromType, continueFromConcerns, continueFromBudget,\n      typeBtnBg: typeValid ? pal.deep : (letter === 'a' ? '#F0E4E2' : '#E3D9F0'),\n      typeBtnColor: typeValid ? '#FFFFFF' : (letter === 'a' ? '#B4A8A2' : '#A79BB5'),\n      typeBtnCursor: typeValid ? 'pointer' : 'not-allowed',\n      concernsBtnBg: concernsValid ? pal.deep : (letter === 'a' ? '#F0E4E2' : '#E3D9F0'),\n      concernsBtnColor: concernsValid ? '#FFFFFF' : (letter === 'a' ? '#B4A8A2' : '#A79BB5'),\n      concernsBtnCursor: concernsValid ? 'pointer' : 'not-allowed',\n      budgetBtnBg: budgetValid ? pal.deep : (letter === 'a' ? '#F0E4E2' : '#E3D9F0'),\n      budgetBtnColor: budgetValid ? '#FFFFFF' : (letter === 'a' ? '#B4A8A2' : '#A79BB5'),\n      budgetBtnCursor: budgetValid ? 'pointer' : 'not-allowed',\n      signupValid, createAccount,\n      signupBtnBg: signupValid ? pal.deep : (letter === 'a' ? '#F0E4E2' : '#E3D9F0'),\n      signupBtnColor: signupValid ? '#FFFFFF' : (letter === 'a' ? '#B4A8A2' : '#A79BB5'),\n      signupBtnCursor: signupValid ? 'pointer' : 'not-allowed',\n      signupHint: (st.signupEmail || st.signupPassword) && !signupValid\n        ? (!emailRe.test(st.signupEmail) ? 'Enter a valid email address' : 'Password must be at least 6 characters')\n        : '',\n      loginValid, doLogin,\n      loginBtnBg: loginValid ? pal.deep : (letter === 'a' ? '#F0E4E2' : '#E3D9F0'),\n      loginBtnColor: loginValid ? '#FFFFFF' : (letter === 'a' ? '#B4A8A2' : '#A79BB5'),\n      loginBtnCursor: loginValid ? 'pointer' : 'not-allowed',\n      loginHint: (st.loginEmail || st.loginPassword) && !loginValid\n        ? (!loginFormatValid\n            ? (!emailRe.test(st.loginEmail) ? 'Enter a valid email address' : 'Password must be at least 6 characters')\n            : (!hasAccount ? 'No account found \\u2014 create one first' : 'Email or password doesn\\u2019t match our records'))\n        : '',\n      goScan: go('scan'), goResult: go('result'), goAlternatives: go('alternatives'), goProfile: go('profile'),\n      goPrivacy: go('privacy'), goHelp: go('help'),\n      skinType: st.skinType, skinTypeSummary: st.skinType ? (st.skinType + (st.sensitive ? ', Sensitive' : '')) : 'Not set',\n      topConcern: st.concerns[0] || 'Not set', budget: st.budget || 'Not set',\n      concernsSummary: (() => {\n        const parts = [...st.concerns];\n        if (st.otherSelected && st.otherConcern.trim()) parts.push(st.otherConcern.trim());\n        return parts.length ? parts.join(', ') : 'None set';\n      })(),\n      otherSelected: st.otherSelected, otherConcern: st.otherConcern, setOtherConcern,\n      signupName: st.signupName, setSignupName: setField('signupName'),\n      displayName: (st.signupName && st.signupName.trim()) || 'there',\n      displayEmail: st.signupEmail || st.loginEmail || 'your@email.com',\n      avatarInitial: (st.signupName && st.signupName.trim()) ? st.signupName.trim().charAt(0).toUpperCase() : 'S',\n      signupEmail: st.signupEmail, setSignupEmail: setField('signupEmail'),\n      signupPassword: st.signupPassword, setSignupPassword: setField('signupPassword'),\n      loginEmail: st.loginEmail, setLoginEmail: setField('loginEmail'),\n      loginPassword: st.loginPassword, setLoginPassword: setField('loginPassword'),\n      skinTypes, sensitiveOptions, concernOptions, otherChip, budgetOptions,\n      recentScans, hasScanHistory, noScanHistory: !hasScanHistory, captureScan, reasons, altProducts, profileRows, tabs,\n      notificationsOn: st.notificationsOn, toggleNotifications, logOut,\n      notifToggleBg: st.notificationsOn ? pal.deep : (letter === 'a' ? '#E4D9D5' : '#DED3EA'),\n      notifKnobPos: st.notificationsOn ? '18px' : '0px',\n      saveHistoryOn: st.saveHistoryOn, toggleSaveHistory,\n      saveHistoryBg: st.saveHistoryOn ? pal.deep : (letter === 'a' ? '#E4D9D5' : '#DED3EA'),\n      saveHistoryKnobPos: st.saveHistoryOn ? '18px' : '0px',\n      personalizedOn: st.personalizedOn, togglePersonalized,\n      personalizedBg: st.personalizedOn ? pal.deep : (letter === 'a' ? '#E4D9D5' : '#DED3EA'),\n      personalizedKnobPos: st.personalizedOn ? '18px' : '0px',\n      confirmLogout: st.confirmLogout, openLogoutConfirm, cancelLogout,\n    };\n  }\n\n  renderVals() {\n    return {\n      a: this.buildVariant('a'),\n      b: this.buildVariant('b'),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
